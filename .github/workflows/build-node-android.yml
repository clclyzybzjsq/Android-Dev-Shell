name: build-node-android

# Cross-compile Node.js for Android arm64 (bionic) -> libnode.so
# Recipe adapted from termux/termux-packages packages/nodejs (MIT).
on:
  workflow_dispatch:
    inputs:
      node_version:
        description: "Node.js version to cross-compile"
        required: false
        default: "26.13.1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 patchelf file clang-19
          # node 26's V8 needs host clang >= 19.1 (consteval lambdas in regexp
          # bytecodes); ubuntu-24.04 default clang is 18. If 19 is not in the
          # distro repos, fall back to apt.llvm.org.
          if ! command -v clang-19 >/dev/null; then
            wget -q https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh 19
          fi
          clang-19 --version | head -1

      - name: Pin ninja 1.11.1
        # ninja >= 1.12 errors on the duplicate stamp rules that v8_inspector_headers
        # generates in node cross builds; 1.11.1 is the last release with warn-only
        # behavior (node-android/build.sh also passes -w dupbuild=warn).
        run: |
          curl -sL -o /tmp/ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.11.1/ninja-linux.zip
          sudo mkdir -p /usr/local/ninja111
          sudo unzip -o /tmp/ninja.zip -d /usr/local/ninja111
          echo /usr/local/ninja111 >> "$GITHUB_PATH"
          ninja --version

      - name: Setup Android NDK r29
        # node 26's V8 requires clang++ >= 19.1.0 (std::atomic_ref in libc++);
        # NDK r28c ships clang 19.0.1 which fails. NDK r29 satisfies it
        # (matches termux's current nodejs packaging).
        run: |
          curl -sL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          sudo mkdir -p /opt/ndk
          sudo unzip -q /tmp/ndk.zip -d /opt/ndk
          echo "ANDROID_NDK_LATEST_HOME=/opt/ndk/android-ndk-r29" >> "$GITHUB_ENV"
          /opt/ndk/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin/clang --version | head -2

      - name: Build libnode.so (arm64)
        env:
          NODE_VERSION: ${{ inputs.node_version || '26.13.1' }}
        working-directory: node-android
        run: bash build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libnode-arm64-v8a-${{ inputs.node_version || '26.13.1' }}
          path: node-android/out/libnode.so
          if-no-files-found: error
